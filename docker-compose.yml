services:

  # ── PHP 8.2 + Apache + Supabase PostgreSQL ─────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kidlearn_web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./docker/apache.conf:/etc/apache2/sites-enabled/000-default.conf:ro

