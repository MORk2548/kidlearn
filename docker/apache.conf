<VirtualHost *>
    DocumentRoot /var/www/html
    ServerName localhost

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # กำหนด header สำหรับ session cookie
    Header always set X-Content-Type-Options nosniff

    ErrorLog ${APACHE_LOG_DIR}/kidlearn_error.log
    CustomLog ${APACHE_LOG_DIR}/kidlearn_access.log combined
</VirtualHost>
